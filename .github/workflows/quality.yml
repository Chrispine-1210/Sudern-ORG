name: SUDERN security, quality and PostgreSQL integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sudern-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-and-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run verify:manifest
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sudern_test
          POSTGRES_PASSWORD: isolated_ci_test_only_2026
          POSTGRES_DB: sudern_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sudern_test -d sudern_test"
          --health-interval 5s --health-timeout 4s --health-retries 12
    env:
      PG_TEST_DATABASE_URL: postgresql://sudern_test:isolated_ci_test_only_2026@localhost:5432/sudern_test
      INTAKE_ENABLED: 'true'
      SANDBOX: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Create isolated per-run MFA encryption key
        run: node -e "console.log('MFA_ENCRYPTION_KEY='+require('crypto').randomBytes(32).toString('base64'))" >> "$GITHUB_ENV"
      - name: Execute exact application workflows on PostgreSQL 17
        run: npm run test:postgres
      - name: Restore encrypted synthetic PostgreSQL backup into a fresh target
        # This tests pg_dump + AES-256-GCM + pg_restore + application integrity.
        # Do NOT upload dump artifacts or repurpose this for production databases.
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "${PG_CONTAINER:?postgres service missing}"
          export SUDERN_BACKUP_KEY="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("base64"))')"
          dump="$RUNNER_TEMP/sudern-ci.dump"
          cipher="$RUNNER_TEMP/sudern-ci.dump.aesgcm"
          restored="$RUNNER_TEMP/sudern-ci-restored.dump"
          trap 'rm -f "$dump" "$cipher" "$restored"' EXIT
          docker exec "$PG_CONTAINER" pg_dump -U sudern_test -d sudern_test -Fc > "$dump"
          node scripts/secure-pg-backup.js encrypt "$dump" "$cipher"
          rm -f "$dump"
          node scripts/secure-pg-backup.js decrypt "$cipher" "$restored"
          docker exec "$PG_CONTAINER" createdb -U sudern_test sudern_restore
          cat "$restored" | docker exec -i "$PG_CONTAINER" pg_restore -U sudern_test -d sudern_restore --no-owner --no-privileges --exit-on-error
          DATABASE_URL=postgresql://sudern_test:isolated_ci_test_only_2026@localhost:5432/sudern_restore npm run verify:postgres
          docker exec "$PG_CONTAINER" psql -U sudern_test -d sudern_restore -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT COUNT(*) FROM users)>0 AND (SELECT COUNT(*) FROM audit)>0 AND (SELECT COUNT(*) FROM expenses)>0" | grep -qx t
          sql="SELECT json_build_object('users',(SELECT count(*) FROM users),'applications',(SELECT count(*) FROM applications),'participants',(SELECT count(*) FROM participants),'funds',(SELECT count(*) FROM funds),'expenses',(SELECT count(*) FROM expenses),'evidence',(SELECT count(*) FROM evidence),'governance',(SELECT count(*) FROM governance),'audit',(SELECT count(*) FROM audit),'audit_tip',(SELECT event_hash FROM audit ORDER BY seq DESC LIMIT 1))::text"
          source_signature="$(docker exec "$PG_CONTAINER" psql -U sudern_test -d sudern_test -Atc "$sql")"
          restored_signature="$(docker exec "$PG_CONTAINER" psql -U sudern_test -d sudern_restore -Atc "$sql")"
          test "$source_signature" = "$restored_signature"
          echo 'PASS: encrypted PostgreSQL backup restored to empty target, record counts and audit tip match'

  protected-preview-smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: [static-and-legacy, isolated-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: sudern-preview-approval
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticated synthetic exact-commit preview smoke
        run: npm run preview:smoke
        env:
          SUDERN_PREVIEW_URL: ${{ vars.SUDERN_PREVIEW_URL }}
          SUDERN_EXPECTED_SHA: ${{ github.sha }}
          SUDERN_SYNTHETIC_EMAIL: ${{ secrets.SUDERN_SYNTHETIC_EMAIL }}
          SUDERN_SYNTHETIC_PASSWORD: ${{ secrets.SUDERN_SYNTHETIC_PASSWORD }}
          SUDERN_SYNTHETIC_TOTP_SECRET: ${{ secrets.SUDERN_SYNTHETIC_TOTP_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
